[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipsc-digital-twin-production"
version = "1.0.0"
description = "Production-oriented iPSC digital twin platform utilities"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "iPSC Digital Twin Team" }]
license = { text = "Proprietary" }
dependencies = [
  "anndata>=0.12",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
visualization = [
  "matplotlib>=3.7",
]
tuning = [
  "optuna>=4.0,<5.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
  "mypy>=1.8",
]

[project.scripts]
ipsc-twin = "ipsc_digital_twin.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = false
exclude = ["tests/"]
